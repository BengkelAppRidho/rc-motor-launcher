name: Build RC Motor Launcher Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rc-motor-release.jks"
          echo "RC_KEYSTORE_PATH=$RUNNER_TEMP/rc-motor-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Motor-Launcher-release-v1.2
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
